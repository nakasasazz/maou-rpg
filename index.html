function tileAt(map, x, y) {
  if (x < 0 || y < 0 || x >= MAPS[map].w || y >= MAPS[map].h) return "#";
  return grids[map][y].charAt(x);
}

/* ============ Sections (cave & castle vision) ============
   Every tile gets a section id. Only the player's current section is
   visible (plus a 1-tile fringe of neighbouring sections: entrances and
   boundary walls), with wall occlusion inside it. */
function paintRect(arr, x0, y0, x1, y1, ch) {
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) arr[y][x] = ch;
}
function buildSections(map, base) {
  const a = [];
  for (let y = 0; y < MAPS[map].h; y++) a.push(new Array(MAPS[map].w).fill(base));
  return a;
}

/* Migrate any older save (v0.1/v0.2 fields) to v0.3: missing fields get
   defaults. A legacy save whose chest was already opened counts as
   chest stage 1, so the sleep powder (stage 2) is still obtainable. */
function migrateSave(loaded) {
  const s = Object.assign(freshState(), loaded || {});
  if (!loaded || typeof loaded.chestStage !== "number") {
    s.chestStage = (loaded && loaded.chestOpened) ? 1 : 0;
  }
  s.chestOpened = s.chestStage >= 1;
  if (typeof s.hasSleepPowder !== "boolean") s.hasSleepPowder = false;
  if (typeof s.water !== "number") s.water = 0;
  s.stats = Object.assign({ wins:0, steps:0, deaths:0, elapsedMs:0 }, (loaded && loaded.stats) || {});
  if (!("clearRecord" in s) || s.clearRecord === undefined) s.clearRecord = null;
  return s;
}

/* Play-time accumulation: stats.elapsedMs is the saved base; while the
   page is open, elapsed = base + (now - playStart). Saving rebases. */
let playStart = Date.now();
function currentElapsed() { return (S.stats ? S.stats.elapsedMs : 0) + (Date.now() - playStart); }
function fmtTime(ms) {
  const sec = Math.floor(ms / 1000);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), ss = sec % 60;
  const p = n => (n < 10 ? "0" : "") + n;
  return h > 0 ? h + ":" + p(m) + ":" + p(ss) : p(m) + ":" + p(ss);
}

function heroMaxHp() { return LEVELS[S.lv].maxhp; }

/* ============ IndexedDB save — same db/store/key as v0.1/v0.2 ============ */
let dbPromise = null;
function openDB() {
  if (!dbPromise) {
    dbPromise = new Promise((res, rej) => {
      const rq = indexedDB.open("maou-rpg", 1);
      rq.onupgradeneeded = () => { rq.result.createObjectStore("save"); };
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
  }
  return dbPromise;
}
async function saveGame() {
  const snap = JSON.parse(JSON.stringify(S));
  snap.stats.elapsedMs = currentElapsed();
  const db = await openDB();
  await new Promise((res, rej) => {
    const tx = db.transaction("save", "readwrite");
    tx.objectStore("save").put(snap, "main");
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
  S.stats.elapsedMs = snap.stats.elapsedMs;
  playStart = Date.now();
}
function saveQuiet() { saveGame().catch(() => {}); }
async function loadGame() {
  try {
    const db = await openDB();
    return await new Promise(res => {
      const rq = db.transaction("save", "readonly").objectStore("save").get("main");
      rq.onsuccess = () => res(rq.result || null);
      rq.onerror = () => res(null);
    });
  } catch (e) { return null; }
}
async function deleteSave() {
  try {
    const db = await openDB();
    db.transaction("save", "readwrite").objectStore("save").delete("main");
  } catch (e) {}
}

/* ============ Vision ============ */
const VISION_RADIUS = { village:5 }; // field: unlimited; cave/castle: sections
const SIGHT_BLOCKERS = "#?CISTON";
function blocksSight(map, x, y) { return SIGHT_BLOCKERS.indexOf(tileAt(map, x, y)) >= 0; }
/* Grid raycast (Amanatides & Woo). The target tile itself is not tested,
   so a wall is visible while tiles behind it are not. When the ray passes
   exactly through a grid corner, both orthogonal neighbours are tested,
   which prevents diagonal corner leaking. */
function losClear(map, x0, y0, x1, y1) {
  let x = x0, y = y0;
  const dx = x1 - x0, dy = y1 - y0;
  const stepX = Math.sign(dx), stepY = Math.sign(dy);
  const tDeltaX = dx !== 0 ? Math.abs(1 / dx) : Infinity;
  const tDeltaY = dy !== 0 ? Math.abs(1 / dy) : Infinity;
  let tMaxX = dx !== 0 ? tDeltaX * 0.5 : Infinity;
  let tMaxY = dy !== 0 ? tDeltaY * 0.5 : Infinity;
  while (x !== x1 || y !== y1) {
    if (Math.abs(tMaxX - tMaxY) < 1e-9) {
      if (blocksSight(map, x + stepX, y) || blocksSight(map, x, y + stepY)) return false;
      x += stepX; y += stepY; tMaxX += tDeltaX; tMaxY += tDeltaY;
    } else if (tMaxX < tMaxY) {
      x += stepX; tMaxX += tDeltaX;
    } else {
      y += stepY; tMaxY += tDeltaY;
    }
    if (x === x1 && y === y1) break;
    if (blocksSight(map, x, y)) return false;
  }
  return true;
}
function isVisible(x, y) {
  if (x === S.x && y === S.y) return true;
  if (S.map === "field") return true; // no limit inside the viewport
  if (S.map === "village") {
    const r = VISION_RADIUS.village;
    if (Math.abs(x - S.x) > r || Math.abs(y - S.y) > r) return false;
    return losClear(S.map, S.x, S.y, x, y);
  }
  // cave / castle: section-based vision + LOS
  const sec = SECTIONS[S.map];
  if (!sec || !sec[y]) return true;
  const ps = sec[S.y][S.x], ts = sec[y][x];
  if (ts !== ps) {
    // Fringe: a tile of another section that touches the player's section
    // (an entrance tile or a boundary wall) can be seen; nothing deeper.
    let fringe = false;
    const nb = [[1,0],[-1,0],[0,1],[0,-1]];
    for (const d of nb) {
      const nx = x + d[0], ny = y + d[1];
      if (sec[ny] && sec[ny][nx] === ps) { fringe = true; break; }
    }
    if (!fringe) return false;
  }
  return losClear(S.map, S.x, S.y, x, y);
}

/* ============ Canvas setup: fixed 400x240 logical resolution ============ */
const cv = document.getElementById("game"), ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
const W = 400, H = 240;
const HIDDEN_COLOR = "#05080D";
const INDOOR = { village:true, cave:true, castle:true }; // 32px tiles indoors

function fitCanvas() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width = (W * scale) + "px";
  cv.style.height = (H * scale) + "px";
}
window.addEventListener("resize", fitCanvas);
fitCanvas();

function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
function inRect(p, x, y, w, h) { return p.x >= x && p.x < x + w && p.y >= y && p.y < y + h; }

/* ============ Modes & UI state ============ */
let mode = "map"; // "map" | "menu" | "battle"
let lastPointer = false; // on-screen controls shown only after actual pointer use
let dialogPages = null;
let dialogChoices = null;
let pendingChoices = null;

/* ---------- dialog (map mode, bottom box only while active) ---------- */
function wrapLine(text) {
  const MAX = 30, out = [];
  let t = text;
  while (t.length > MAX) { out.push(t.substring(0, MAX)); t = t.substring(MAX); }
  out.push(t);
  return out;
}
function showDialog(lines, choices) {
  const pages = [];
  lines.forEach(ln => {
    const w = wrapLine(ln);
    for (let i = 0; i < w.length; i += 2) pages.push(w.slice(i, i + 2));
  });
  dialogPages = pages;
  pendingChoices = choices || null;
  dialogChoices = null;
  draw();
}
function dialogActive() { return dialogPages !== null || dialogChoices !== null; }
function advanceDialog() {
  if (dialogChoices) return;
  if (!dialogPages) return;
  dialogPages.shift();
  if (dialogPages.length === 0) {
    dialogPages = null;
    if (pendingChoices) {
      dialogChoices = { title: pendingChoices.title, options: pendingChoices.options, sel: 0 };
      pendingChoices = null;
    }
  }
  draw();
}
function chooseDialogOption(i) {
  const c = dialogChoices;
  if (!c) return;
  dialogChoices = null;
  draw();
  c.options[i].fn();
}

/* ---------- menu (hierarchical) ---------- */
let menuScreen = "root"; // root | items | status | save | settings
const menuCursors = { root:0, items:0, save:0, settings:0 };
let soundOn = true;
let saveResult = "";
let itemsNote = "";
let newGameArmed = false;

function inventoryList() {
  const list = [
    { id:"herb",   label:"やくそう ×" + S.herbs, desc:"HPを16回復" },
    { id:"water",  label:"水びん ×" + S.water,   desc:"水の入ったびん。魔物に投げつけることができる。" }

    list.push({ id:"powder", label:"ねむり粉", desc:"魔物に振りかける粉。1回の戦闘で一度だけ使える。" });
  }
  return list;
}
function rootItems() {
  return [
    { id:"items",    label:"どうぐ" },
    { id:"status",   label:"つよさ" },
    { id:"save",     label:"セーブ" },
    { id:"settings", label:"せってい" },
    { id:"back",     label:"もどる" }
  ];
}
function settingsItems() {
  return [
    { id:"sound",   label:"おと " + (soundOn ? "ON" : "OFF"), desc:"おとの ON/OFF（いまは表示だけです）" },
    { id:"newgame", label:"ニューゲーム", desc: newGameArmed ? "もう一度 決定すると、セーブを消して 最初からになります" : "セーブを消して 最初から やり直します" }
  ];
}
function currentList() {
  if (menuScreen === "root") return rootItems();
  if (menuScreen === "items") return inventoryList();
  if (menuScreen === "save") return [{ id:"save", label:"セーブする" }];
  if (menuScreen === "settings") return settingsItems();
  return []; // status: no selection
}
function openMenu() {
  mode = "menu"; menuScreen = "root"; saveResult = ""; itemsNote = ""; newGameArmed = false;
  draw();
}
function closeMenu() { mode = "map"; draw(); }
function menuBack() {
  if (menuScreen === "root") closeMenu();
  else { menuScreen = "root"; newGameArmed = false; draw(); }
}
async function resetGame() {
  await deleteSave();
  S = freshState();
  grids.cave = MAPS.cave.grid.slice();
  grids.castle = MAPS.castle.grid.slice();
  playStart = Date.now();
  spawnEnemies();
  mode = "map"; menuScreen = "root"; newGameArmed = false;
  saveQuiet();
  showDialog(["新しい冒険が始まった。"]);
  draw();
}
function menuConfirm() {
  const list = currentList();
  const cur = menuCursors[menuScreen] || 0;
  const item = list[cur];
  if (!item) return;
  if (menuScreen === "root") {
    if (item.id === "back") closeMenu();
    else { menuScreen = item.id; saveResult = ""; itemsNote = ""; draw(); }
  } else if (menuScreen === "items") {
    if (item.id === "herb") {
      if (S.herbs <= 0) { itemsNote = "やくそうが ない"; }
      else if (S.hp >= heroMaxHp()) { itemsNote = "HPは まんたんだ"; }
      else {
        S.herbs--;
        const healed = Math.min(16, heroMaxHp() - S.hp);
        S.hp += healed;
        itemsNote = "HPが " + healed + " 回復した";
        saveQuiet();
      }
      draw();
    } else if (item.id === "water") {
      itemsNote = "魔物に投げつけるものだ。戦闘中に使おう。";
      draw();
    } else if (item.id === "powder") {
      itemsNote = "戦闘中に使うものだ。";
      draw();
    }
  } else if (menuScreen === "save") {
    if (item.id === "save") {
      saveResult = "";
      saveGame().then(() => { saveResult = "セーブしました"; draw(); })
                .catch(() => { saveResult = "セーブに失敗しました"; draw(); });
    }
  } else if (menuScreen === "settings") {
    if (item.id === "sound") { soundOn = !soundOn; draw(); }
    else if (item.id === "newgame") {
      if (!newGameArmed) { newGameArmed = true; draw(); }
      else resetGame();
    }
  }
}
function menuMove(d) {
  const list = currentList();
  if (list.length === 0) return;
  const n = list.length;
  menuCursors[menuScreen] = ((menuCursors[menuScreen] || 0) + d + n) % n;
  itemsNote = "";
  if (menuScreen === "settings") newGameArmed = false;
  draw();
}
function menuClick(p) {
  if (inRect(p, 16, 206, 80, 26)) { menuBack(); return; }
  const list = currentList();
  for (let i = 0; i < list.length; i++) {
    if (inRect(p, 32, 50 + i * 26, 336, 26)) {
      if (menuCursors[menuScreen] === i) menuConfirm();
      else { menuCursors[menuScreen] = i; itemsNote = ""; if (menuScreen === "settings") newGameArmed = false; draw(); }
      return;
    }
  }
}

/* ============ Drawing helpers ============ */
function drawSprite(c, grid, cx, cy, size) {
  const px = size / 16;
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const col = PALETTE[grid[y].charAt(x)];
    if (col) { c.fillStyle = col; c.fillRect(cx + x * px, cy + y * px, px, px); }
  }
}
function drawSpriteH(c, grid, cx, cy, w, h) { // sprite with independent w/h (flattened puni)
  const px = w / 16, py = h / 16;
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const col = PALETTE[grid[y].charAt(x)];
    if (col) { c.fillStyle = col; c.fillRect(cx + x * px, cy + y * py, px, py); }
  }
}
function drawPerson(c, px, py, color, size) {
  const u = (size || 16) / 16;
  c.fillStyle = "#17202A"; c.fillRect(px + 5*u, py + 1*u, 6*u, 3*u);   // hair
  c.fillStyle = "#f2c894"; c.fillRect(px + 5*u, py + 3*u, 6*u, 5*u);   // head
  c.fillStyle = color;     c.fillRect(px + 4*u, py + 8*u, 8*u, 5*u);   // body
  c.fillStyle = "#17202A"; c.fillRect(px + 5*u, py + 13*u, 2*u, 3*u); c.fillRect(px + 9*u, py + 13*u, 2*u, 3*u); // legs
}
function box(x, y, w, h, fill) {
  ctx.fillStyle = fill || "#101018";
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = "#f0ead6"; ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
}
function text(str, x, y, size, color, align) {
  ctx.fillStyle = color || "#f0ead6";

/* ============ Map rendering ============ */
const TILE_COLORS = {
  village: {floor:"#d8c690", wall:"#7a4a2b", alt:"#cbb582"},
  field:   {floor:"#3f9e4d", wall:"#6b6b6b", alt:"#379145"},
  cave:    {floor:"#3a3a44", wall:"#17171f", alt:"#33333d"},
  castle:  {floor:"#5a5470", wall:"#241f33", alt:"#524c66"}
};
const MENU_BTN = { x:328, y:4, w:68, h:20 };
const DPAD = {
  up:    { x:34, y:156, w:24, h:24, label:"▲" },
  left:  { x:10, y:180, w:24, h:24, label:"◀" },
  right: { x:58, y:180, w:24, h:24, label:"▶" },
  down:  { x:34, y:204, w:24, h:24, label:"▼" }
};
const ABTN = { x:348, y:172, r:20 };

function drawTile(t, dx, dy, ts, pal, mx, my) {
  const u = ts / 16;
  ctx.fillStyle = ((mx + my) % 2 === 0) ? pal.floor : pal.alt;
  ctx.fillRect(dx, dy, ts, ts);
  if (t === "#" || t === "?") { // secret wall looks exactly like a normal wall
    ctx.fillStyle = pal.wall; ctx.fillRect(dx, dy, ts, ts);
    ctx.fillStyle = "rgba(255,255,255,0.08)"; ctx.fillRect(dx, dy, ts, 3 * u);
  } else if (t === "T") {
    ctx.fillStyle = "#6b4a2b"; ctx.fillRect(dx + 7*u, dy + 9*u, 3*u, 6*u);
    ctx.fillStyle = "#1e6b2e"; ctx.beginPath(); ctx.arc(dx + 8*u, dy + 7*u, 6*u, 0, 7); ctx.fill();
  } else if (t === "C" || t === "I" || t === "S") {
    ctx.fillStyle = "#8a5a33"; ctx.fillRect(dx + 1*u, dy + 5*u, 14*u, 11*u);
    ctx.fillStyle = t === "C" ? "#e8e4da" : (t === "I" ? "#c0392b" : "#2471a3");
    ctx.beginPath(); ctx.moveTo(dx, dy + 6*u); ctx.lineTo(dx + 8*u, dy); ctx.lineTo(dx + 16*u, dy + 6*u); ctx.fill();
    text(t === "C" ? "✚" : (t === "I" ? "宿" : "店"), dx + 8*u, dy + 6*u, 8 * u, "#fff", "center");
  } else if (t === "*") {
    if (S.chestStage === 0) { // closed chest
      ctx.fillStyle = "#8a5a33"; ctx.fillRect(dx + 3*u, dy + 6*u, 11*u, 8*u);
      ctx.fillStyle = "#f6c65b"; ctx.fillRect(dx + 3*u, dy + 6*u, 11*u, 3*u); ctx.fillRect(dx + 7*u, dy + 6*u, 3*u, 8*u);
    } else { // opened chest (plain, no glow / marker)
      ctx.fillStyle = "#5d3d22"; ctx.fillRect(dx + 3*u, dy + 8*u, 11*u, 6*u);
      ctx.fillStyle = "#8a5a33"; ctx.fillRect(dx + 3*u, dy + 4*u, 11*u, 3*u);
      ctx.fillStyle = "#2b1a0e"; ctx.fillRect(dx + 4*u, dy + 9*u, 9*u, 4*u);
    }
  } else if (t === "O") { // old cart
    ctx.fillStyle = "#6e4525"; ctx.fillRect(dx + 1*u, dy + 5*u, 14*u, 6*u);
    ctx.fillStyle = "#8a5a33"; ctx.fillRect(dx + 1*u, dy + 5*u, 14*u, 2*u);
    ctx.fillStyle = "#17202A";
    ctx.beginPath(); ctx.arc(dx + 4*u, dy + 13*u, 2.4*u, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(dx + 12*u, dy + 13*u, 2.4*u, 0, 7); ctx.fill();
    ctx.fillStyle = "#f7f5e8"; ctx.fillRect(dx + 6*u, dy + 6*u, 4*u, 3*u); // memo paper
  } else if (t === "N") { // note on the castle wall
    ctx.fillStyle = pal.wall; ctx.fillRect(dx, dy, ts, ts);
    ctx.fillStyle = "#f7f5e8"; ctx.fillRect(dx + 4*u, dy + 3*u, 8*u, 10*u);
    ctx.fillStyle = "#8a8a8a";
    ctx.fillRect(dx + 5.5*u, dy + 5.5*u, 5*u, 1*u);
    ctx.fillRect(dx + 5.5*u, dy + 8*u, 5*u, 1*u);
    ctx.fillRect(dx + 5.5*u, dy + 10.5*u, 3.5*u, 1*u);
  } else if (t === "P") {
    ctx.fillStyle = "#0a0a12"; ctx.fillRect(dx, dy, ts, ts);
    ctx.fillStyle = "#8750c7"; ctx.fillRect(dx + 2*u, dy + 2*u, 2*u, 2*u); ctx.fillRect(dx + 12*u, dy + 12*u, 2*u, 2*u);
  } else if (t === "D" || t === "X" || t === "E" || t === "V" || t === "G") {
    ctx.fillStyle = "#14141c"; ctx.fillRect(dx + 2*u, dy + 2*u, 12*u, 12*u);
    text(t === "G" ? "門" : "↓", dx + 8*u, dy + 4*u, 8 * u, "#f6c65b", "center");
  }
}

function drawMap() {
  const pal = TILE_COLORS[S.map];
  const indoor = !!INDOOR[S.map];
  const ts = indoor ? 32 : 16;                    // tile display size
  const pox = indoor ? 184 : 192, poy = indoor ? 104 : 112; // player tile top-left (hero centered)
  const rx = indoor ? 6 : 12, ryu = indoor ? 4 : 7, ryd = indoor ? 3 : 7;
  ctx.fillStyle = HIDDEN_COLOR; ctx.fillRect(0, 0, W, H);
  for (let my = S.y - ryu; my <= S.y + ryd; my++) for (let mx = S.x - rx; mx <= S.x + rx; mx++) {
    const dx = pox + (mx - S.x) * ts, dy = poy + (my - S.y) * ts;
    if (mx < 0 || my < 0 || mx >= MAPS[S.map].w || my >= MAPS[S.map].h) continue; // out of map: dark
    if (!isVisible(mx, my)) continue; // hidden: dark
    drawTile(tileAt(S.map, mx, my), dx, dy, ts, pal, mx, my);
  }
  // NPCs / enemies: only when visible
  MAPS[S.map].npcs.forEach(n => { if (isVisible(n.x, n.y)) drawPerson(ctx, pox + (n.x - S.x) * ts, poy + (n.y - S.y) * ts, n.color, ts); });
  activeEnemies.forEach(e => { if (!e.inactive && isVisible(e.x, e.y)) drawSprite(ctx, SPRITES[e.type], pox + (e.x - S.x) * ts, poy + (e.y - S.y) * ts, ts); });
  // Player: always at screen center
  drawPerson(ctx, pox, poy, "#2456c7", ts);
  ctx.fillStyle = "#f6c65b"; ctx.fillRect(pox + 5 * (ts/16), poy, 6 * (ts/16), 2 * (ts/16)); // circlet
  // Menu button (always visible on the map screen)
  ctx.fillStyle = "rgba(16,16,24,0.85)"; ctx.fillRect(MENU_BTN.x, MENU_BTN.y, MENU_BTN.w, MENU_BTN.h);
  ctx.strokeStyle = "#f0ead6"; ctx.lineWidth = 1; ctx.strokeRect(MENU_BTN.x + 0.5, MENU_BTN.y + 0.5, MENU_BTN.w - 1, MENU_BTN.h - 1);
  text("メニュー", MENU_BTN.x + MENU_BTN.w / 2, MENU_BTN.y + 4, 11, "#f0ead6", "center");
  // Touch controls (shown only after actual pointer input)
  if (lastPointer && !dialogActive()) {
    ctx.globalAlpha = 0.75;
    for (const k in DPAD) {
      const b = DPAD[k];
      ctx.fillStyle = "#2b2b44"; ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = "#f0ead6"; ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
      text(b.label, b.x + b.w / 2, b.y + 6, 11, "#f0ead6", "center");
    }
    ctx.fillStyle = "#7a2b2b"; ctx.beginPath(); ctx.arc(ABTN.x, ABTN.y, ABTN.r, 0, 7); ctx.fill();
    ctx.strokeStyle = "#f0ead6"; ctx.stroke();
    text("A", ABTN.x, ABTN.y - 7, 13, "#fff", "center");
    ctx.globalAlpha = 1;
  }
  // Dialog box (only while active)
  if (dialogActive()) {
    box(8, 184, 384, 48);
    if (dialogChoices) {
      text(dialogChoices.title || "どうする？", 18, 190, 12);
      let ox = 18;
      dialogChoices.options.forEach((o, i) => {
        const label = (dialogChoices.sel === i ? "▶" : "　") + o.label;
        text(label, ox, 210, 12, dialogChoices.sel === i ? "#f6c65b" : "#f0ead6");
        ox += label.length * 12 + 18;
      });
    } else if (dialogPages && dialogPages.length > 0) {
      dialogPages[0].forEach((ln, i) => text(ln, 18, 190 + i * 18, 12));
      text("▼", 376, 214, 10, "#f0ead6", "center");
    }
  }
}

function wrapDesc(s) {
  const MAX = 21, out = [];

}

/* ============ Movement & interaction ============ */
const DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
function tryMove(dir) {
  if (mode !== "map" || dialogActive()) return;
  S.dir = dir;
  const d = DIRS[dir], nx = S.x + d[0], ny = S.y + d[1];
  if (isSolid(S.map, nx, ny)) { draw(); return; }
  if (MAPS[S.map].npcs.some(n => n.x === nx && n.y === ny)) { draw(); return; }
  S.x = nx; S.y = ny;
  S.stats.steps++;
  const foe = enemyAt(nx, ny);
  if (foe) { startBattle(foe); draw(); return; }
  onStepTile(tileAt(S.map, nx, ny));
  saveQuiet(); draw();
}
function facingPos() { const d = DIRS[S.dir]; return {x:S.x + d[0], y:S.y + d[1]}; }

/*TEST:chest:start*/
function applyChest() {
  if (S.chestStage === 0) {
    S.chestStage = 1; S.chestOpened = true; S.herbs += 2;
    return ["宝箱を開けた！ やくそうを 2個 手に入れた。（現在 " + S.herbs + "個）"];
  }
  if (S.chestStage === 1) {
    S.chestStage = 2; S.hasSleepPowder = true;
    return ["宝箱の底を もう一度調べると……", "二重底になっていた！ ねむり粉の小袋を 手に入れた。"];

  return ["宝箱は空っぽだ。"];
}
/*TEST:chest:end*/

function interact() {

  const f = facingPos();

        }},

          if (S.gold >= 6) { S.gold -= 6; S.herbs++; saveQuiet(); draw(); showDialog(["やくそうを 1個 買った。（現在 " + S.herbs + "個）"]); }
          else showDialog(["お金が足りないようだ。"]);
        }},
        {label:"水びんを買う（3G）", fn:() => {
          if (S.gold >= 3) { S.gold -= 3; S.water++; saveQuiet(); draw(); showDialog(["水びんを 1個 買った。（現在 " + S.water + "個）"]); }
          else showDialog(["お金が足りないようだ。"]);
        }},

  }
}

/* ============ Battle ============ */
/*TEST:king:start*/
function defendReduce(raw) { return Math.floor(raw * 0.25); }
/* King action cycle: phase1 normal(6) -> phase2 wind-up(0) -> phase3 strong(16) -> phase1.
   While asleep the cycle does not advance; when sleep ends after a wind-up
   was cancelled (reset flag), the cycle restarts at phase 1. */
function kingAct(st) {
  if (st.sleep > 0) {
    st.sleep--;
    if (st.sleep === 0 && st.reset) { st.phase = 1; st.reset = false; }
    return { kind:"sleep", dmg:0 };
  }
  if (st.phase === 1) { st.phase = 2; return { kind:"attack", dmg:6 }; }
  if (st.phase === 2) { st.phase = 3; return { kind:"windup", dmg:0 }; }
  st.phase = 1; return { kind:"strong", dmg:16 };
}
/*TEST:king:end*/

let inBattle = false, foe = null, foeHp = 0, battleBusy = false;
let foeState = { sleep:0, phase:1, reset:false }; // sleep = remaining skipped enemy opportunities
let foeFlat = false;        // puni flattened: hero's next attack +3
let defending = false;      // hero is defending this turn
let powderUsed = false;     // sleep powder: once per battle
let foeSkip = false;        // toge soaked by water: skips this turn
let batPreempt = false, batFirstTurn = false;
let battleItemsOpen = false, battleItemCursor = 0;

function setBattleMsg(t) { battleMsg = t; if (mode === "battle") draw(); }
function startBattle(enemy) {
  inBattle = true; foe = enemy; battleBusy = false; battleCursor = 0;
  foeHp = MONSTERS[enemy.type].hp;
  foeState = { sleep:0, phase:1, reset:false };
  foeFlat = false; defending = false; powderUsed = false; foeSkip = false;
  batPreempt = (enemy.type === "bat");
  batFirstTurn = (enemy.type === "bat");
  battleItemsOpen = false; battleItemCursor = 0;
  mode = "battle";
  const m = MONSTERS[enemy.type];
  setBattleMsg(m.name + " が あらわれた！" + (enemy.type === "bat" ? "\nバットンは すばやい！" : ""));
  draw();
}
function endTurn() { defending = false; battleBusy = false; draw(); }
function foeHit(raw, label) {
  const m = MONSTERS[foe.type];
  const dmg = defending ? defendReduce(raw) : raw;
  S.hp -= dmg;
  if (foe.type === "puni" && defending) {
    foeFlat = true;
    setBattleMsg("ぷにぷにの攻撃！\n盾にぶつかって ぺしゃんこになった！");
  } else {
    setBattleMsg((label || (m.name + " の攻撃！")) + "\n" + dmg + " のダメージ！");
  }
  if (S.hp <= 0) { setTimeout(defeat, 900); return; }
  endTurn();
}
function enemyPhase(alreadyActed) {
  if (!inBattle) return;
  if (alreadyActed) { endTurn(); return; }
  const m = MONSTERS[foe.type];
  if (foe.type === "king") {
    const act = kingAct(foeState);
    if (act.kind === "sleep") { setBattleMsg(m.name + "は 眠っている。"); endTurn(); return; }
    if (act.kind === "windup") { setBattleMsg("魔王は こん棒を 大きく振り上げた！"); endTurn(); return; }
    foeHit(act.dmg, act.kind === "strong" ? "魔王の強攻撃！" : "魔王の攻撃！");
    return;
  }
  if (foeState.sleep > 0) {
    foeState.sleep--;
    batFirstTurn = false;
    setBattleMsg(m.name + "は 眠っている。");
    endTurn(); return;
  }
  if (foeSkip) {
    foeSkip = false;
    setBattleMsg(m.name + "は ぬれて動けない！");
    endTurn(); return;
  }
  let label = m.name + " の攻撃！";
  if (foe.type === "bat" && batFirstTurn) label = "バットンの先制攻撃！";
  batFirstTurn = false;
  foeHit(m.atk, label);
}
function heroPhase(action, enemyAlreadyActed) {
  if (!inBattle) return;
  const m = MONSTERS[foe.type];
  if (action.kind !== "fight") foeFlat = false; // a non-attack pick clears the flatten bonus
  if (action.kind === "fight") {
    let dmg = heroAtk() + (foeFlat ? 3 : 0);
    foeFlat = false;
    let crit = false;
    if (Math.random() < 0.05) { dmg *= 2; crit = true; }
    foeHp -= dmg;
    setBattleMsg((crit ? "かいしんの一撃！" : "勇者の攻撃！") + "\n" + dmg + " のダメージ！");
    if (foeHp <= 0) { setTimeout(winBattle, 800); return; }
  } else if (action.kind === "defend") {
    defending = true;
    setBattleMsg("勇者は身を守った。");
  } else if (action.kind === "herb") {
    S.herbs--;
    const healed = Math.min(16, heroMaxHp() - S.hp);
    S.hp += healed;
    setBattleMsg("やくそうを使った。\nHPが " + healed + " 回復した！");
  } else if (action.kind === "water") {
    S.water--;
    if (foe.type === "toge") {
      foeHp -= 8; foeSkip = true;
      setBattleMsg("水びんを投げつけた！\nトゲタケに 8 のダメージ！ 傘がしぼんだ！");
      if (foeHp <= 0) { setTimeout(winBattle, 800); return; }
    } else {
      setBattleMsg("水びんを投げつけた！\nしかし、効果がなかった。");
    }
  } else if (action.kind === "powder") {
    powderUsed = true;
    if (foe.type === "bat" || foe.type === "king") {
      foeState.sleep = 2;
      if (foe.type === "king") foeState.reset = true;
      setBattleMsg("ねむり粉を振りかけた！\n" + m.name + "は 眠ってしまった！");
    } else {
      setBattleMsg("ねむり粉を振りかけた！\nしかし、効果がなかった。");
    }
  }
  setTimeout(() => enemyPhase(enemyAlreadyActed), 800);
}
function heroAction(action) {
  if (!inBattle || battleBusy) return;
  battleBusy = true;
  /* Bat preemptive strike: defend and sleep powder resolve BEFORE it;
     every other first action lets the bat strike first (that strike is
     the bat's action for the turn). */
  if (batPreempt && action.kind !== "defend" && action.kind !== "powder") {
    batPreempt = false; batFirstTurn = false;
    S.hp -= MONSTERS.bat.atk;
    setBattleMsg("バットンの先制攻撃！\n" + MONSTERS.bat.atk + " のダメージ！");
    if (S.hp <= 0) { setTimeout(defeat, 900); return; }
    setTimeout(() => heroPhase(action, true), 800);
    return;
  }
  batPreempt = false;
  heroPhase(action, false);
}
function escapeBattle() {
  foe.inactive = true;
  inBattle = false; foe = null; battleBusy = false; battleItemsOpen = false;
  mode = "map";
  saveQuiet(); draw();
  showDialog(["勇者は逃げ出した。"]);
}
function doRun() {
  if (!inBattle || battleBusy) return;
  if (foe.type === "king") { setBattleMsg("魔王からは逃げられない！"); return; }
  if (batPreempt) {
    batPreempt = false; batFirstTurn = false; battleBusy = true;
    S.hp -= MONSTERS.bat.atk;
    setBattleMsg("バットンの先制攻撃！\n" + MONSTERS.bat.atk + " のダメージ！");
    if (S.hp <= 0) { setTimeout(defeat, 900); return; }
    setTimeout(escapeBattle, 800);
    return;
  }
  escapeBattle();
}
function battleItems() {
  const list = [
    { kind:"herb",  label:"やくそう ×" + S.herbs, usable: S.herbs > 0 },
    { kind:"water", label:"水びん ×" + S.water,   usable: S.water > 0 }
  ];
  if (S.hasSleepPowder) {
    list.push({ kind:"powder", label:"ねむり粉" + (powderUsed ? "（使用済み）" : ""), usable: !powderUsed });
  }
  list.push({ kind:"back", label:"もどる", usable:true });
  return list;
}
function useBattleItem(i) {
  const it = battleItems()[i];
  if (!it) return;
  if (it.kind === "back") { battleItemsOpen = false; draw(); return; }
  if (!it.usable) {
    battleItemsOpen = false;
    setBattleMsg("それは今 使えない。");
    draw(); return;
  }
  battleItemsOpen = false;
  heroAction({ kind: it.kind });
}
function battleCommand(id) {
  if (!inBattle || battleBusy) return;
  if (id === "fight") heroAction({ kind:"fight" });
  else if (id === "defend") heroAction({ kind:"defend" });
  else if (id === "items") { battleItemsOpen = true; battleItemCursor = 0; draw(); }
  else if (id === "run") doRun();
}
function winBattle() {
  const m = MONSTERS[foe.type];
  S.stats.wins++;
  S.exp += m.exp; S.gold += m.gold;
  const lines = [m.name + " を倒した！", m.exp + " EXP、" + m.gold + " G を手に入れた。"];
  while (S.lv < 3 && EXP_NEXT[S.lv] && S.exp >= EXP_NEXT[S.lv]) {
    S.lv++; S.hp += 6;
    lines.push("レベルが " + S.lv + " に上がった！ 最大HP+6、攻撃力 " + heroAtk() + "。");
  }
  foe.inactive = true;
  const wasBoss = foe.type === "king";
  inBattle = false; foe = null; battleBusy = false; battleItemsOpen = false;
  mode = "map";
  if (wasBoss) {
    S.cleared = true;
    S.clearRecord = { timeMs: currentElapsed(), lv: S.lv, wins: S.stats.wins, steps: S.stats.steps, deaths: S.stats.deaths };
    saveQuiet(); draw();
    showDialog(lines.concat([
      "魔王を倒した！",
      "クリア時間　" + fmtTime(S.clearRecord.timeMs),
      "クリアレベル　" + S.clearRecord.lv,
      "戦闘勝利回数　" + S.clearRecord.wins,
      "歩数　" + S.clearRecord.steps,
      "全滅回数　" + S.clearRecord.deaths
    ]));
  } else {
    saveQuiet(); draw();
    showDialog(lines);
  }
}
function defeat() {
  inBattle = false; foe = null; battleBusy = false; battleItemsOpen = false;
  mode = "map";
  S.stats.deaths++;
  S.hp = heroMaxHp();
  S.map = "village"; S.x = 2; S.y = 3; S.dir = "down";
  spawnEnemies(); saveQuiet(); draw();
  showDialog(["勇者は死んでしまった……", "教会で目を覚ました。HPは全回復している。", "（EXP・ゴールド・アイテムは失われていない）"]);
}

/* ============ Input: keyboard ============ */
document.addEventListener("keydown", e => {
  lastPointer = false;
  const k = e.key;
  const isConfirm = (k === " " || k === "z" || k === "Z" || k === "Enter");
  if (mode === "menu") {
    if (k === "ArrowUp" || k === "w" || k === "W") { menuMove(-1); e.preventDefault(); }
    else if (k === "ArrowDown" || k === "s" || k === "S") { menuMove(1); e.preventDefault(); }
    else if (k === "Enter" || k === "z" || k === "Z") { menuConfirm(); e.preventDefault(); }
    else if (k === "Backspace" || k === "x" || k === "X" || k === "Escape") { menuBack(); e.preventDefault(); }
    return;
  }
  if (mode === "battle") {
    if (battleItemsOpen) {
      const n = battleItems().length;
      if (k === "ArrowUp" || k === "w" || k === "W") { battleItemCursor = (battleItemCursor + n - 1) % n; draw(); e.preventDefault(); }
      else if (k === "ArrowDown" || k === "s" || k === "S") { battleItemCursor = (battleItemCursor + 1) % n; draw(); e.preventDefault(); }
      else if (isConfirm) { useBattleItem(battleItemCursor); e.preventDefault(); }
      else if (k === "Backspace" || k === "x" || k === "X" || k === "Escape") { battleItemsOpen = false; draw(); e.preventDefault(); }
      return;
    }
    if (k === "ArrowLeft" || k === "a" || k === "A") { battleCursor = (battleCursor + BCMDS.length - 1) % BCMDS.length; draw(); e.preventDefault(); }
    else if (k === "ArrowRight" || k === "d" || k === "D") { battleCursor = (battleCursor + 1) % BCMDS.length; draw(); e.preventDefault(); }
    else if (isConfirm) { battleCommand(BCMDS[battleCursor].id); e.preventDefault(); }
    return;
  }
  // map mode
  if (k === "x" || k === "X" || k === "Escape") {
    if (!dialogActive()) { openMenu(); e.preventDefault(); }
    return;
  }
  if (dialogActive()) {
    if (dialogChoices) {
      if (k === "ArrowLeft" || k === "a" || k === "A" || k === "ArrowRight" || k === "d" || k === "D") {
        dialogChoices.sel = (dialogChoices.sel + 1) % dialogChoices.options.length; draw(); e.preventDefault();
      } else if (isConfirm) { chooseDialogOption(dialogChoices.sel); e.preventDefault(); }
      return;
    }
    if (isConfirm) { advanceDialog(); e.preventDefault(); }
    return;
  }
  if (k === "ArrowUp" || k === "w" || k === "W") { tryMove("up"); e.preventDefault(); }
  else if (k === "ArrowDown" || k === "s" || k === "S") { tryMove("down"); e.preventDefault(); }
  else if (k === "ArrowLeft" || k === "a" || k === "A") { tryMove("left"); e.preventDefault(); }
  else if (k === "ArrowRight" || k === "d" || k === "D") { tryMove("right"); e.preventDefault(); }
  else if (isConfirm) { interact(); e.preventDefault(); }
});

/* ============ Input: pointer (mouse / touch) — shown only after actual pointer use ============ */
cv.addEventListener("pointerdown", e => {
  lastPointer = true;
  const p = toLogical(e);
  if (mode === "menu") { menuClick(p); return; }
  if (mode === "battle") {
    if (battleItemsOpen) {
      const list = battleItems();
      for (let i = 0; i < list.length; i++) {
        if (inRect(p, 8, 160 + i * 16, 384, 16)) {
          if (battleItemCursor === i) useBattleItem(i);
          else { battleItemCursor = i; draw(); }
          return;
        }
      }
      return;
    }
    for (let i = 0; i < BCMDS.length; i++) {
      const r = cmdRect(i);
      if (inRect(p, r.x, r.y, r.w, r.h)) {
        if (battleCursor === i) battleCommand(BCMDS[i].id);
        else { battleCursor = i; draw(); }
        return;
      }
    }
    return;
  }
  // map mode
  if (dialogActive()) {
    if (dialogChoices) {
      const n = dialogChoices.options.length;
      if (inRect(p, 8, 184, 384, 48)) {
        const idx = Math.min(n - 1, Math.floor((p.x - 8) / 384 * n));
        if (dialogChoices.sel === idx) chooseDialogOption(idx);
        else { dialogChoices.sel = idx; draw(); }
      }
      return;
    }
    advanceDialog();
    return;
  }
  if (inRect(p, MENU_BTN.x, MENU_BTN.y, MENU_BTN.w, MENU_BTN.h)) { openMenu(); return; }
  for (const key in DPAD) {
    const b = DPAD[key];
    if (inRect(p, b.x, b.y, b.w, b.h)) { tryMove(key); return; }
  }
  const ddx = p.x - ABTN.x, ddy = p.y - ABTN.y;
  if (ddx * ddx + ddy * ddy <= ABTN.r * ABTN.r) { interact(); return; }
});

/* ============ Boot ============ */
(async () => {
  const loaded = await loadGame();
  if (loaded && loaded.map && MAPS[loaded.map]) {
    S = migrateSave(loaded);
    if (S.secretOpen) setTile("cave", 1, 6, "P");
  }
  playStart = Date.now();
  spawnEnemies();
  draw();
  showDialog([S.cleared ? "（セーブデータを読み込んだ。クリア済みの世界だ）" : "（セーブデータを読み込んだ／新しい冒険）"]);
})();
</script>
