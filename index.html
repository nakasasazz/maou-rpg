function tileAt(map, x, y) {
  if (x < 0 || y < 0 || x >= MAPS[map].w || y >= MAPS[map].h) return "#";
  return grids[map][y].charAt(x);

  if (t === "S") return map === "village"; // village: shop building; dungeons: stairs (step on to change floor)

/* ============ Sheets (v0.4 vision, v0.5 rule) ============
   No radius/LOS/section vision anywhere: the village and field are fully
   visible, and in the cave/castle each map is ~70% visible with a few
   opaque cloth "sheets" (rectangles) hiding a dead end, the chest, the
   stairs or the boss. v0.5: a sheet's interior is visible ONLY while the
   hero is inside that sheet; stepping out re-covers it. Visibility is
   derived from the hero's current position every frame, so no opened
   state is kept or saved at all. Sheets have no collision of their own
   and give no message when they open or close. The hidden wall is NOT
   under a sheet: a sheet's existence is obvious, a secret passage's is not. */
const SHEETS = [
  { id:"C1-A", map:"cave1",   x0:2, y0:1, x1:5,  y1:4 }, // west dead end (empty)
  { id:"C1-B", map:"cave1",   x0:7, y0:1, x1:10, y1:4 }, // stairs to B2F
  { id:"C2-A", map:"cave2",   x0:1, y0:1, x1:4,  y1:4 }, // treasure chest
  { id:"C2-B", map:"cave2",   x0:7, y0:1, x1:10, y1:4 }, // old cart
  { id:"K1-A", map:"castle1", x0:1, y0:1, x1:4,  y1:3 }, // note
  { id:"K1-B", map:"castle1", x0:7, y0:1, x1:10, y1:3 }, // stairs to 2F
  { id:"K2-A", map:"castle2", x0:1, y0:1, x1:4,  y1:3 }, // west dead end (empty)
  { id:"K2-B", map:"castle2", x0:7, y0:1, x1:10, y1:3 }  // the Demon King
];
function sheetAt(map, x, y) {
  for (const sh of SHEETS) {
    if (sh.map === map && x >= sh.x0 && x <= sh.x1 && y >= sh.y0 && y <= sh.y1) return sh;
  }
  return null;
}
/* The sheet the hero is currently standing in, or null. A sheet is open
   exactly while this returns that sheet: arriving by stairs onto a tile
   inside a sheet counts as inside, and stepping out closes it again on
   that same move. */
function currentSheet() { return sheetAt(S.map, S.x, S.y); }
function isSheetOpen(sh) { return currentSheet() === sh; }
function isCovered(map, x, y) {
  const sh = sheetAt(map, x, y);
  return !!sh && !isSheetOpen(sh);
}
let lastSheetId = null;
function updateSheetEntered() {
  const sh = currentSheet();
  const id = sh ? sh.id : null;
  if (id && id !== lastSheetId) logEvent("sheet_enter", { sheet:id });
  lastSheetId = id;
}

/* ============ State ============ */
/*TEST:migrate:start*/
function freshState() {

/* Migrate any older save (v0.1-v0.3 fields) to the current format:
   missing fields get defaults. A legacy save whose chest was already
   opened counts as chest stage 1, so the sleep powder (stage 2) is
   still obtainable. v0.4: old vision state is dropped, and a position
   inside the old single cave/castle maps is moved to the new sub-map
   arrival point (cave -> cave1 entrance, castle -> castle1 gate) so
   the hero can never end up buried in a wall. v0.5: a v0.4 save's
   openedSheets field is simply discarded — sheet visibility is no
   longer stored state. */
function migrateSave(loaded) {
  const s = Object.assign(freshState(), loaded || {});
  if (!loaded || typeof loaded.chestStage !== "number") {
    s.chestStage = (loaded && loaded.chestOpened) ? 1 : 0;
  }
  s.chestOpened = s.chestStage >= 1;
  if (typeof s.hasSleepPowder !== "boolean") s.hasSleepPowder = false;
  if (typeof s.water !== "number") s.water = 0;
  delete s.openedSheets; // v0.4 field, ignored since v0.5
  if (s.map === "cave")   { s.map = "cave1";   s.x = 9; s.y = 7; }
  if (s.map === "castle") { s.map = "castle1"; s.x = 6; s.y = 5; }
  s.stats = Object.assign({ wins:0, steps:0, deaths:0, elapsedMs:0, battleTurns:0, talks:0 }, (loaded && loaded.stats) || {});
  if (typeof s.soundOn !== "boolean") s.soundOn = true;
  if (!("clearRecord" in s) || s.clearRecord === undefined) s.clearRecord = null;
  return s;
}

/* Play-time accumulation: stats.elapsedMs is the saved base; while the
   page is open, elapsed = base + (now - playStart). Saving rebases. */
let playStart = Date.now();
function currentElapsed() { return (S.stats ? S.stats.elapsedMs : 0) + (Date.now() - playStart); }
function fmtTime(ms) {
  const sec = Math.floor(ms / 1000);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), ss = sec % 60;
  const p = n => (n < 10 ? "0" : "") + n;
  return h > 0 ? h + ":" + p(m) + ":" + p(ss) : p(m) + ":" + p(ss);
}

/* ============ Play log (research data, IndexedDB key "log") ============
   The log is intentionally separate from the game save: it records what
   the player actually did (map changes, talks, battles and their length,
   discoveries) so a session can be exported and studied. It is capped,
   and writes are batched: important events flush immediately, everything
   else flushes on a timer. */
const LOG_CAP = 5000;
const LOG_FLUSH_MS = 10000;
const IMPORTANT_LOG_EVENTS = { start:true, load:true, battle_end:true, levelup:true, wipe:true, chest:true, secret_open:true, boss_win:true, save:true };
let playLog = { version:1, events:[], dropped:0 };
let logDirty = false;
let logFlushTimer = null;
let logFlushPromise = null;
function scheduleLogFlush() {
  if (logFlushTimer !== null || typeof setTimeout !== "function") return;
  logFlushTimer = setTimeout(() => { logFlushTimer = null; flushLog(); }, LOG_FLUSH_MS);
}
function flushLog() {
  if (logFlushPromise) return logFlushPromise;
  if (!logDirty) return Promise.resolve();
  const snapshot = JSON.parse(JSON.stringify(playLog));
  logDirty = false;
  logFlushPromise = (async () => {
    try {
      const db = await openDB();
      await new Promise((res, rej) => {
        const tx = db.transaction("save", "readwrite");
        tx.objectStore("save").put(snapshot, "log");
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
      });
    } catch (e) {
      logDirty = true;
    } finally {
      logFlushPromise = null;
      if (logDirty) scheduleLogFlush();
    }
  })();
  return logFlushPromise;
}
async function loadPlayLog() {
  try {
    const rec = await idbGet("log");
    if (rec && Array.isArray(rec.events)) {
      playLog = { version:1, events:rec.events.slice(), dropped:(typeof rec.dropped === "number" ? rec.dropped : 0) };
    }
  } catch (e) { /* an absent/corrupt log simply starts empty */ }
  logDirty = false;
}
function logEvent(type, fields) {
  const ev = { t: Math.max(0, Math.round(currentElapsed())), type:type };
  if (fields) Object.assign(ev, fields);
  playLog.events.push(ev);
  if (playLog.events.length > LOG_CAP) {
    const removed = playLog.events.length - LOG_CAP;
    playLog.events.splice(0, removed);
    playLog.dropped += removed;
  }
  logDirty = true;
  if (IMPORTANT_LOG_EVENTS[type]) {
    if (logFlushTimer !== null && typeof clearTimeout === "function") { clearTimeout(logFlushTimer); logFlushTimer = null; }
    flushLog();
  } else {
    scheduleLogFlush();
  }
  return ev;
}

/* ============ Sound (WebAudio, synthesized; no external assets) ============
   The context is created lazily on the first user gesture (browser
   autoplay policy). Every tone is a tiny oscillator blip. The settings
   option is persisted as S.soundOn; when it is off, nothing plays. */
let audioCtx = null;
function audioCtor() {
  const g = (typeof globalThis !== "undefined") ? globalThis : {};
  return g.AudioContext || (g.window && g.window.AudioContext) || g.webkitAudioContext || (g.window && g.window.webkitAudioContext) || null;
}
function initAudio() {
  const Ctor = audioCtor();
  if (!Ctor) return null;
  if (!audioCtx) {
    try { audioCtx = new Ctor(); } catch (e) { return null; }
  }
  if (audioCtx.state === "suspended" && audioCtx.resume) {
    try { const p = audioCtx.resume(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
  }
  return audioCtx;
}
function tone(freq, dur, opts) {
  if (!S.soundOn) return;
  const ac = initAudio();
  if (!ac || !ac.createOscillator || !ac.createGain) return;
  opts = opts || {};
  const t0 = (ac.currentTime || 0) + (opts.at || 0);
  const osc = ac.createOscillator();
  const gainNode = ac.createGain();
  const peak = (typeof opts.gain === "number") ? opts.gain : 0.08;
  osc.type = opts.type || "square";
  if (osc.frequency) {
    if (osc.frequency.setValueAtTime) osc.frequency.setValueAtTime(freq, t0);
    else osc.frequency.value = freq;
    if (opts.slideTo && osc.frequency.exponentialRampToValueAtTime) {
      try { osc.frequency.exponentialRampToValueAtTime(Math.max(1, opts.slideTo), t0 + dur); } catch (e) {}
    }
  }
  if (gainNode.gain) {
    const gp = gainNode.gain;
    if (gp.setValueAtTime && gp.linearRampToValueAtTime && gp.exponentialRampToValueAtTime) {
      gp.setValueAtTime(0.0001, t0);
      gp.linearRampToValueAtTime(peak, t0 + 0.005);
      gp.exponentialRampToValueAtTime(0.0001, t0 + dur);
    } else {
      gp.value = peak;
    }
  }
  osc.connect(gainNode);
  gainNode.connect(ac.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
}
/* playSound('pitfall') exists as a hook for future pitfall tiles: it is
   implemented (a descending slide) but no tile triggers it yet. */
function playSound(name, arg) {
  if (!S.soundOn) return;
  switch (name) {
    case "confirm": tone(880, 0.06, { type:"square", gain:0.10 }); break;
    case "cancel":  tone(440, 0.05, { type:"square", gain:0.06 }); break;
    case "cursor":  tone(1200, 0.02, { type:"square", gain:0.025 }); break;
    case "talk":
      if (arg === "child") { tone(990, 0.05, { type:"square", gain:0.07 }); tone(990, 0.05, { type:"square", gain:0.07, at:0.07 }); }
      else if (arg === "woman") tone(740, 0.07, { type:"triangle", gain:0.08 });
      else if (arg === "man") tone(330, 0.08, { type:"square", gain:0.08 });
      else tone(520, 0.05, { type:"triangle", gain:0.07 }); // object / default
      break;
    case "transition": tone(660, 0.12, { type:"triangle", gain:0.06, slideTo:330 }); break;
    case "hit": tone(180, 0.05, { type:"square", gain:0.11, slideTo:80 }); break;
    case "defeat": tone(392, 0.09, { type:"square", gain:0.08 }); tone(262, 0.14, { type:"square", gain:0.08, at:0.09 }); break;
    case "victory": [523, 659, 784].forEach((f, i) => tone(f, 0.09, { type:"square", gain:0.07, at:i * 0.09 })); break;
    case "levelup": [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.09, { type:"triangle", gain:0.08, at:i * 0.08 })); break;
    case "pitfall": tone(600, 0.35, { type:"sawtooth", gain:0.07, slideTo:80 }); break;
  }
}

function heroMaxHp() { return LEVELS[S.lv].maxhp; }
function heroAtk() { return LEVELS[S.lv].atk; }

/* Enemy respawn unit = the whole dungeon (v0.4): enemy states are kept
   per map, and a dungeon group's states are reset only when the hero
   enters that group from outside it. Moving cave1<->cave2 or
   castle1<->castle2 therefore does NOT respawn normal enemies and does
   not clear flee-inactivity; going out to the field (or crossing between
   cave and castle) does. The boss never respawns once defeated. */
const DUNGEON_GROUP = { cave1:"cave", cave2:"cave", castle1:"castle", castle2:"castle" };
function groupOf(map) { return DUNGEON_GROUP[map] || map; }
let enemyStates = {}; // map -> [{type,x,y,inactive}]
function freshEnemies(map) {
  return MAPS[map].enemies
    .filter(e => !(e.type === "king" && S.cleared))
    .map(e => ({type:e.type, x:e.x, y:e.y, inactive:false}));
}
function spawnEnemies() {
  if (!enemyStates[S.map]) enemyStates[S.map] = freshEnemies(S.map);
  activeEnemies = enemyStates[S.map];
}
function enemyAt(x, y) {
  return activeEnemies.find(e => !e.inactive && e.x === x && e.y === y);
}

/* ============ IndexedDB save — same db/store/key as v0.1/v0.2 ============ */
let dbPromise = null;
function openDB() {
  if (!dbPromise) {
    dbPromise = new Promise((res, rej) => {
      const rq = indexedDB.open("maou-rpg", 1);
      rq.onupgradeneeded = () => { rq.result.createObjectStore("save"); };
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
  }
  return dbPromise;
}
async function saveGame() {
  const snap = JSON.parse(JSON.stringify(S));
  snap.stats.elapsedMs = currentElapsed();
  const db = await openDB();
  await new Promise((res, rej) => {
    const tx = db.transaction("save", "readwrite");
    tx.objectStore("save").put(snap, "main");
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
  S.stats.elapsedMs = snap.stats.elapsedMs;
  playStart = Date.now();
}
function saveQuiet() { saveGame().catch(() => {}); }
async function loadGame() {
  try {
    const db = await openDB();
    return await new Promise(res => {
      const rq = db.transaction("save", "readonly").objectStore("save").get("main");
      rq.onsuccess = () => res(rq.result || null);
      rq.onerror = () => res(null);
    });
  } catch (e) { return null; }
}
async function idbGet(key) {
  const db = await openDB();
  return await new Promise(res => {
    const rq = db.transaction("save", "readonly").objectStore("save").get(key);
    rq.onsuccess = () => res(rq.result || null);
    rq.onerror = () => res(null);
  });
}
async function deleteSave() {
  try {
    const db = await openDB();
    db.transaction("save", "readwrite").objectStore("save").delete("main");
  } catch (e) {}
}

/* ============ Vision (v0.4, v0.5 rule) ============
   There is no stored visibility state: every map renders in full,
   except that sheets in the cave/castle are drawn over their rectangle
   whenever the hero is not inside them (see SHEETS above and drawMap). */

/* ============ Canvas setup: fixed 400x240 logical resolution ============ */
const cv = document.getElementById("game"), ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
const W = 400, H = 240;
const HIDDEN_COLOR = "#05080D";
const INDOOR = { village:true, cave1:true, cave2:true, castle1:true, castle2:true }; // 32px tiles indoors

function fitCanvas() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width = (W * scale) + "px";
  cv.style.height = (H * scale) + "px";
}
window.addEventListener("resize", fitCanvas);
fitCanvas();

function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
function inRect(p, x, y, w, h) { return p.x >= x && p.x < x + w && p.y >= y && p.y < y + h; }

/* ============ Modes & UI state ============ */
let mode = "map"; // "map" | "menu" | "battle"
let lastPointer = false; // on-screen controls shown only after actual pointer use
let dialogPages = null;
let dialogChoices = null;
let pendingChoices = null;

/* ---------- dialog (map mode, bottom box only while active) ---------- */
function wrapLine(text) {
  const MAX = 30, out = [];
  let t = text;
  while (t.length > MAX) { out.push(t.substring(0, MAX)); t = t.substring(MAX); }
  out.push(t);
  return out;
}
function showDialog(lines, choices) {
  const pages = [];
  lines.forEach(ln => {
    const w = wrapLine(ln);
    for (let i = 0; i < w.length; i += 2) pages.push(w.slice(i, i + 2));
  });
  dialogPages = pages;
  pendingChoices = choices || null;
  dialogChoices = null;
  draw();
}
function dialogActive() { return dialogPages !== null || dialogChoices !== null; }
/* A conversation/inspection starts here: it counts as one talk, is
   logged with its target and voice type, and plays the talk sound in
   that voice. Continuation pages and choice results use showDialog
   directly and are not counted again. */
function startTalk(lines, target, voiceType, choices) {
  const voice = voiceType || "object";
  S.stats.talks++;
  logEvent("talk", { target: target || "object", voiceType: voice });
  playSound("talk", voice);
  saveQuiet();
  showDialog(lines, choices);
}
function advanceDialog() {
  if (dialogChoices) return;
  if (!dialogPages) return;
  playSound("confirm");
  dialogPages.shift();
  if (dialogPages.length === 0) {
    dialogPages = null;
    if (pendingChoices) {
      dialogChoices = { title: pendingChoices.title, options: pendingChoices.options, sel: 0 };
      pendingChoices = null;
    }
  }
  draw();
}
function chooseDialogOption(i) {
  const c = dialogChoices;
  if (!c) return;
  playSound("confirm");
  dialogChoices = null;
  draw();
  c.options[i].fn();
}

/* ---------- menu (hierarchical) ---------- */
let menuScreen = "root"; // root | items | status | record | save | settings
const menuCursors = { root:0, items:0, record:0, save:0, settings:0 };
let saveResult = "";
let itemsNote = "";
let recordNote = "";
let recordPaneText = "";
let newGameArmed = false;

function inventoryList() {

    { id:"herb",   label:"やくそう ×" + S.herbs, desc:"HPを16回復" },
    { id:"water",  label:"水びん ×" + S.water,   desc:"水の入ったびん。魔物に投げつけることができる。" }
  ];
  if (S.hasSleepPowder) {
    list.push({ id:"powder", label:"ねむり粉", desc:"魔物に振りかける粉。1回の戦闘で一度だけ使える。" });
  }
  return list;
}
function rootItems() {
  return [
    { id:"items",    label:"どうぐ" },
    { id:"status",   label:"つよさ" },
    { id:"record",   label:"きろく" },
    { id:"save",     label:"セーブ" },
    { id:"settings", label:"せってい" },
    { id:"back",     label:"もどる" }
  ];
}
function recordItems() {
  return [
    { id:"copy",   label:"コピー",   desc:"プレイ経過をクリップボードにコピーします" },
    { id:"export", label:"ログ出力", desc:"プレイログをJSONファイルに保存します" }
  ];
}
function settingsItems() {
  return [
    { id:"sound",   label:"おと " + (S.soundOn ? "ON" : "OFF"), desc:"おとの ON/OFF" },

  ];
}
function currentList() {
  if (menuScreen === "root") return rootItems();
  if (menuScreen === "items") return inventoryList();
  if (menuScreen === "record") return recordItems();
  if (menuScreen === "save") return [{ id:"save", label:"セーブする" }];
  if (menuScreen === "settings") return settingsItems();
  return []; // status: no selection
}
/* ---------- play history: share text & log export ---------- */
function formatCount(n) { return Number(n || 0).toLocaleString("en-US"); }
/* The share text deliberately contains no undiscovered secrets: it never
   mentions the hidden passage, the chest's second layer, or the sleep
   powder (not even after the powder is obtained). */
function buildShareText() {
  return "maou-rpg v0.6 / Lv" + S.lv +
    " / プレイ時間 " + fmtTime(currentElapsed()) +
    " / 歩数 " + formatCount(S.stats.steps) +
    " / 勝利 " + S.stats.wins +
    " / 全滅 " + S.stats.deaths +
    " / 魔王：" + (S.cleared ? "撃破" : "未撃破") +
    " / 現在地：" + MAPS[S.map].name;
}
async function copyShareText() {
  const txt = buildShareText();
  try {
    if (typeof navigator === "undefined" || !navigator.clipboard || !navigator.clipboard.writeText) throw new Error("clipboard unavailable");
    await navigator.clipboard.writeText(txt);
    recordNote = "コピーしました";
    recordPaneText = "";
  } catch (e) {
    recordNote = "コピーできませんでした。下の文字列を手でコピーしてください。";
    recordPaneText = txt;
  }
  draw();
}
function exportPlayLog() {
  try {
    const now = new Date();
    const p = n => (n < 10 ? "0" : "") + n;
    const name = "maou-rpg-log-" + now.getFullYear() + p(now.getMonth() + 1) + p(now.getDate()) + "-" + p(now.getHours()) + p(now.getMinutes()) + ".json";
    const blob = new Blob([JSON.stringify(playLog, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    if (document.body && document.body.appendChild) document.body.appendChild(a);
    a.click();
    if (a.remove) a.remove();
    if (typeof setTimeout === "function") setTimeout(() => { if (URL.revokeObjectURL) URL.revokeObjectURL(url); }, 1000);
    recordNote = "ログを出力しました：" + name;
    recordPaneText = "";
    flushLog();
  } catch (e) {
    recordNote = "ログ出力に失敗しました";
    recordPaneText = "";
  }
  draw();
}

function openMenu() {
  mode = "menu"; menuScreen = "root"; saveResult = ""; itemsNote = ""; recordNote = ""; recordPaneText = ""; newGameArmed = false;
  draw();
}
function closeMenu() { mode = "map"; draw(); }
function menuBack() {
  playSound("cancel");
  if (menuScreen === "root") closeMenu();
  else { menuScreen = "root"; newGameArmed = false; draw(); }
}
async function resetGame() {
  await deleteSave();
  S = freshState();
  for (const k in MAPS) grids[k] = MAPS[k].grid.slice();
  enemyStates = {};
  playStart = Date.now();
  spawnEnemies();
  lastSheetId = currentSheet() ? currentSheet().id : null;
  mode = "map"; menuScreen = "root"; newGameArmed = false;
  logEvent("start");
  saveQuiet();
  showDialog(["新しい冒険が始まった。"]);
  draw();
}
function menuConfirm() {
  const list = currentList();
  const cur = menuCursors[menuScreen] || 0;
  const item = list[cur];
  if (!item) return;
  if (menuScreen === "root" && item.id === "back") { menuBack(); return; }
  playSound("confirm");
  if (menuScreen === "root") {
    menuScreen = item.id; saveResult = ""; itemsNote = ""; recordNote = ""; recordPaneText = ""; draw();
  } else if (menuScreen === "record") {
    if (item.id === "copy") copyShareText();
    else if (item.id === "export") exportPlayLog();
  } else if (menuScreen === "items") {
    if (item.id === "herb") {
      if (S.herbs <= 0) { itemsNote = "やくそうが ない"; }
      else if (S.hp >= heroMaxHp()) { itemsNote = "HPは まんたんだ"; }
      else {
        S.herbs--;
        const healed = Math.min(16, heroMaxHp() - S.hp);
        S.hp += healed;
        itemsNote = "HPが " + healed + " 回復した";
        saveQuiet();
      }
      draw();
    } else if (item.id === "water") {
      itemsNote = "魔物に投げつけるものだ。戦闘中に使おう。";
      draw();
    } else if (item.id === "powder") {
      itemsNote = "戦闘中に使うものだ。";
      draw();
    }
  } else if (menuScreen === "save") {
    if (item.id === "save") {
      saveResult = "";
      saveGame().then(() => { logEvent("save"); saveResult = "セーブしました"; draw(); })
                .catch(() => { saveResult = "セーブに失敗しました"; draw(); });
    }
  } else if (menuScreen === "settings") {
    if (item.id === "sound") {
      const wasOn = S.soundOn;
      S.soundOn = !S.soundOn;
      if (!wasOn && S.soundOn) { initAudio(); playSound("confirm"); }
      saveQuiet();
      draw();
    }
    else if (item.id === "newgame") {
      if (!newGameArmed) { newGameArmed = true; draw(); }
      else resetGame();
    }
  }
}
function menuMove(d) {
  const list = currentList();
  if (list.length === 0) return;
  const n = list.length;
  const before = menuCursors[menuScreen] || 0;
  menuCursors[menuScreen] = (before + d + n) % n;
  if (menuCursors[menuScreen] !== before) playSound("cursor");
  itemsNote = "";
  recordNote = ""; recordPaneText = "";
  if (menuScreen === "settings") newGameArmed = false;
  draw();
}
function menuClick(p) {
  if (inRect(p, 16, 206, 80, 26)) { menuBack(); return; }
  const list = currentList();
  const baseY = (menuScreen === "record") ? 148 : 50;
  for (let i = 0; i < list.length; i++) {
    if (inRect(p, 32, baseY + i * 26, 336, 26)) {
      if (menuCursors[menuScreen] === i) menuConfirm();
      else { menuCursors[menuScreen] = i; playSound("cursor"); itemsNote = ""; recordNote = ""; recordPaneText = ""; if (menuScreen === "settings") newGameArmed = false; draw(); }
      return;
    }
  }
}

/* ============ Drawing helpers ============ */
function drawSprite(c, grid, cx, cy, size) {
  const px = size / 16;
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const col = PALETTE[grid[y].charAt(x)];
    if (col) { c.fillStyle = col; c.fillRect(cx + x * px, cy + y * px, px, px); }
  }
}
function drawSpriteH(c, grid, cx, cy, w, h) { // sprite with independent w/h (flattened puni)
  const px = w / 16, py = h / 16;
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const col = PALETTE[grid[y].charAt(x)];
    if (col) { c.fillStyle = col; c.fillRect(cx + x * px, cy + y * py, px, py); }
  }
}
function drawPerson(c, px, py, color, size) {
  const u = (size || 16) / 16;
  c.fillStyle = "#17202A"; c.fillRect(px + 5*u, py + 1*u, 6*u, 3*u);   // hair
  c.fillStyle = "#f2c894"; c.fillRect(px + 5*u, py + 3*u, 6*u, 5*u);   // head
  c.fillStyle = color;     c.fillRect(px + 4*u, py + 8*u, 8*u, 5*u);   // body
  c.fillStyle = "#17202A"; c.fillRect(px + 5*u, py + 13*u, 2*u, 3*u); c.fillRect(px + 9*u, py + 13*u, 2*u, 3*u); // legs
}
function box(x, y, w, h, fill) {
  ctx.fillStyle = fill || "#101018";
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = "#f0ead6"; ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
}
function text(str, x, y, size, color, align) {
  ctx.fillStyle = color || "#f0ead6";
  ctx.font = (size || 12) + "px sans-serif";
  ctx.textAlign = align || "left";
  ctx.textBaseline = "top";
  ctx.fillText(str, x, y);
}

/* ============ Map rendering ============ */
const TILE_COLORS = {
  village: {floor:"#d8c690", wall:"#7a4a2b", alt:"#cbb582"},
  field:   {floor:"#3f9e4d", wall:"#6b6b6b", alt:"#379145"},
  cave1:   {floor:"#3a3a44", wall:"#17171f", alt:"#33333d"},
  cave2:   {floor:"#3a3a44", wall:"#17171f", alt:"#33333d"},
  castle1: {floor:"#5a5470", wall:"#241f33", alt:"#524c66"},
  castle2: {floor:"#5a5470", wall:"#241f33", alt:"#524c66"}
};
const MENU_BTN = { x:328, y:4, w:68, h:20 };
const DPAD = {
  up:    { x:34, y:156, w:24, h:24, label:"▲" },
  left:  { x:10, y:180, w:24, h:24, label:"◀" },
  right: { x:58, y:180, w:24, h:24, label:"▶" },
  down:  { x:34, y:204, w:24, h:24, label:"▼" }
};
const ABTN = { x:348, y:172, r:20 };

function drawTile(t, dx, dy, ts, pal, mx, my) {
  const u = ts / 16;
  ctx.fillStyle = ((mx + my) % 2 === 0) ? pal.floor : pal.alt;
  ctx.fillRect(dx, dy, ts, ts);
  if (t === "#" || t === "?") { // secret wall looks exactly like a normal wall
    ctx.fillStyle = pal.wall; ctx.fillRect(dx, dy, ts, ts);
    ctx.fillStyle = "rgba(255,255,255,0.08)"; ctx.fillRect(dx, dy, ts, 3 * u);
  } else if (t === "T") {
    ctx.fillStyle = "#6b4a2b"; ctx.fillRect(dx + 7*u, dy + 9*u, 3*u, 6*u);
    ctx.fillStyle = "#1e6b2e"; ctx.beginPath(); ctx.arc(dx + 8*u, dy + 7*u, 6*u, 0, 7); ctx.fill();
  } else if (t === "C" || t === "I" || (t === "S" && S.map === "village")) {
    ctx.fillStyle = "#8a5a33"; ctx.fillRect(dx + 1*u, dy + 5*u, 14*u, 11*u);
    ctx.fillStyle = t === "C" ? "#e8e4da" : (t === "I" ? "#c0392b" : "#2471a3");
    ctx.beginPath(); ctx.moveTo(dx, dy + 6*u); ctx.lineTo(dx + 8*u, dy); ctx.lineTo(dx + 16*u, dy + 6*u); ctx.fill();
    text(t === "C" ? "✚" : (t === "I" ? "宿" : "店"), dx + 8*u, dy + 6*u, 8 * u, "#fff", "center");
  } else if (t === "*") {
    if (S.chestStage === 0) { // closed chest
      ctx.fillStyle = "#8a5a33"; ctx.fillRect(dx + 3*u, dy + 6*u, 11*u, 8*u);
      ctx.fillStyle = "#f6c65b"; ctx.fillRect(dx + 3*u, dy + 6*u, 11*u, 3*u); ctx.fillRect(dx + 7*u, dy + 6*u, 3*u, 8*u);
    } else { // opened chest (plain, no glow / marker)
      ctx.fillStyle = "#5d3d22"; ctx.fillRect(dx + 3*u, dy + 8*u, 11*u, 6*u);
      ctx.fillStyle = "#8a5a33"; ctx.fillRect(dx + 3*u, dy + 4*u, 11*u, 3*u);
      ctx.fillStyle = "#2b1a0e"; ctx.fillRect(dx + 4*u, dy + 9*u, 9*u, 4*u);
    }
  } else if (t === "O") { // old cart
    ctx.fillStyle = "#6e4525"; ctx.fillRect(dx + 1*u, dy + 5*u, 14*u, 6*u);
    ctx.fillStyle = "#8a5a33"; ctx.fillRect(dx + 1*u, dy + 5*u, 14*u, 2*u);
    ctx.fillStyle = "#17202A";
    ctx.beginPath(); ctx.arc(dx + 4*u, dy + 13*u, 2.4*u, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(dx + 12*u, dy + 13*u, 2.4*u, 0, 7); ctx.fill();
    ctx.fillStyle = "#f7f5e8"; ctx.fillRect(dx + 6*u, dy + 6*u, 4*u, 3*u); // memo paper
  } else if (t === "N") { // note on the castle wall
    ctx.fillStyle = pal.wall; ctx.fillRect(dx, dy, ts, ts);
    ctx.fillStyle = "#f7f5e8"; ctx.fillRect(dx + 4*u, dy + 3*u, 8*u, 10*u);
    ctx.fillStyle = "#8a8a8a";
    ctx.fillRect(dx + 5.5*u, dy + 5.5*u, 5*u, 1*u);
    ctx.fillRect(dx + 5.5*u, dy + 8*u, 5*u, 1*u);
    ctx.fillRect(dx + 5.5*u, dy + 10.5*u, 3.5*u, 1*u);
  } else if (t === "P") {
    ctx.fillStyle = "#0a0a12"; ctx.fillRect(dx, dy, ts, ts);
    ctx.fillStyle = "#8750c7"; ctx.fillRect(dx + 2*u, dy + 2*u, 2*u, 2*u); ctx.fillRect(dx + 12*u, dy + 12*u, 2*u, 2*u);
  } else if (t === "D" || t === "X" || t === "E" || t === "V" || t === "G" || t === "S") { // dungeon 'S' = stairs
    ctx.fillStyle = "#14141c"; ctx.fillRect(dx + 2*u, dy + 2*u, 12*u, 12*u);
    text(t === "G" ? "門" : "↓", dx + 8*u, dy + 4*u, 8 * u, "#f6c65b", "center");
  }
}

function drawMap() {
  const pal = TILE_COLORS[S.map];
  const indoor = !!INDOOR[S.map];
  const ts = indoor ? 32 : 16;                    // tile display size
  const pox = indoor ? 184 : 192, poy = indoor ? 104 : 112; // player tile top-left (hero centered)
  const rx = indoor ? 6 : 12, ryu = indoor ? 4 : 7, ryd = indoor ? 3 : 7;
  ctx.fillStyle = HIDDEN_COLOR; ctx.fillRect(0, 0, W, H);
  for (let my = S.y - ryu; my <= S.y + ryd; my++) for (let mx = S.x - rx; mx <= S.x + rx; mx++) {
    const dx = pox + (mx - S.x) * ts, dy = poy + (my - S.y) * ts;
    if (mx < 0 || my < 0 || mx >= MAPS[S.map].w || my >= MAPS[S.map].h) continue; // out of map: dark
    drawTile(tileAt(S.map, mx, my), dx, dy, ts, pal, mx, my);
  }
  // NPCs / enemies: never drawn while hidden under a closed sheet
  MAPS[S.map].npcs.forEach(n => { if (!isCovered(S.map, n.x, n.y)) drawPerson(ctx, pox + (n.x - S.x) * ts, poy + (n.y - S.y) * ts, n.color, ts); });
  activeEnemies.forEach(e => { if (!e.inactive && !isCovered(S.map, e.x, e.y)) drawSprite(ctx, SPRITES[e.type], pox + (e.x - S.x) * ts, poy + (e.y - S.y) * ts, ts); });
  // Closed sheets: opaque dark blue-grey cloth with a lattice pattern.
  // Drawn over terrain and objects, under the hero. No icon, no animation,
  // and the chest's sheet looks exactly like every other sheet. A sheet is
  // drawn only while the hero is NOT inside it (v0.5).
  for (const sh of SHEETS) {
    if (sh.map !== S.map || isSheetOpen(sh)) continue;
    const dx = pox + (sh.x0 - S.x) * ts, dy = poy + (sh.y0 - S.y) * ts;
    const sw = (sh.x1 - sh.x0 + 1) * ts, shh = (sh.y1 - sh.y0 + 1) * ts;
    ctx.fillStyle = "#293344"; ctx.fillRect(dx, dy, sw, shh);
    ctx.strokeStyle = "#354356"; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let gx = dx + 8; gx < dx + sw; gx += 8) { ctx.moveTo(gx + 0.5, dy); ctx.lineTo(gx + 0.5, dy + shh); }
    for (let gy = dy + 8; gy < dy + shh; gy += 8) { ctx.moveTo(dx, gy + 0.5); ctx.lineTo(dx + sw, gy + 0.5); }
    ctx.stroke();
    ctx.strokeStyle = "#59677B"; ctx.lineWidth = 2; ctx.strokeRect(dx + 1, dy + 1, sw - 2, shh - 2);
  }
  // Player: always at screen center
  drawPerson(ctx, pox, poy, "#2456c7", ts);
  ctx.fillStyle = "#f6c65b"; ctx.fillRect(pox + 5 * (ts/16), poy, 6 * (ts/16), 2 * (ts/16)); // circlet
  // Menu button (always visible on the map screen)
  ctx.fillStyle = "rgba(16,16,24,0.85)"; ctx.fillRect(MENU_BTN.x, MENU_BTN.y, MENU_BTN.w, MENU_BTN.h);
  ctx.strokeStyle = "#f0ead6"; ctx.lineWidth = 1; ctx.strokeRect(MENU_BTN.x + 0.5, MENU_BTN.y + 0.5, MENU_BTN.w - 1, MENU_BTN.h - 1);
  text("メニュー", MENU_BTN.x + MENU_BTN.w / 2, MENU_BTN.y + 4, 11, "#f0ead6", "center");
  // Touch controls (shown only after actual pointer input)
  if (lastPointer && !dialogActive()) {
    ctx.globalAlpha = 0.75;
    for (const k in DPAD) {
      const b = DPAD[k];
      ctx.fillStyle = "#2b2b44"; ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = "#f0ead6"; ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
      text(b.label, b.x + b.w / 2, b.y + 6, 11, "#f0ead6", "center");
    }
    ctx.fillStyle = "#7a2b2b"; ctx.beginPath(); ctx.arc(ABTN.x, ABTN.y, ABTN.r, 0, 7); ctx.fill();
    ctx.strokeStyle = "#f0ead6"; ctx.stroke();
    text("A", ABTN.x, ABTN.y - 7, 13, "#fff", "center");
    ctx.globalAlpha = 1;
  }
  // Dialog box (only while active)
  if (dialogActive()) {
    box(8, 184, 384, 48);
    if (dialogChoices) {
      text(dialogChoices.title || "どうする？", 18, 190, 12);
      let ox = 18;
      dialogChoices.options.forEach((o, i) => {
        const label = (dialogChoices.sel === i ? "▶" : "　") + o.label;
        text(label, ox, 210, 12, dialogChoices.sel === i ? "#f6c65b" : "#f0ead6");
        ox += label.length * 12 + 18;
      });
    } else if (dialogPages && dialogPages.length > 0) {
      dialogPages[0].forEach((ln, i) => text(ln, 18, 190 + i * 18, 12));
      text("▼", 376, 214, 10, "#f0ead6", "center");
    }
  }
}

/* ============ Menu rendering ============ */
const SCREEN_TITLES = { root:"メニュー", items:"どうぐ", status:"つよさ", record:"きろく", save:"セーブ", settings:"せってい" };
function wrapText(s, max) {
  const out = [];
  let t = String(s);
  while (t.length > max) { out.push(t.substring(0, max)); t = t.substring(max); }
  out.push(t);
  return out;
}
function drawRecordMenu() {
  ctx.fillStyle = "#101018"; ctx.fillRect(0, 0, W, H);
  text("きろく", 16, 12, 15);
  text("v0.6", 384, 14, 9, "#888", "right");
  const rows = [

/* ============ Map transitions ============ */
function goTo(map, x, y) {
  const from = S.map;
  // Entering a dungeon group from outside it respawns that group's enemies.
  const pg = groupOf(S.map), ng = groupOf(map);
  if (pg !== ng) for (const m in MAPS) if (groupOf(m) === ng) enemyStates[m] = freshEnemies(m);
  S.map = map; S.x = x; S.y = y;
  spawnEnemies();
  if (from !== map) {
    logEvent("map", { from:from, to:map });
    playSound("transition");
  }
  updateSheetEntered();
  // Sheet visibility follows the new position automatically (v0.5).
  saveQuiet(); draw();
}
/* Arrival positions are always a separate floor tile next to the
   connection tile, so transfers never chain. Field-side tiles/positions
   are unchanged from v0.3; they now point at the sub-maps. The field
   position (27,13) — where the cave's east exit emerges — is also the
   way back into cave2. */
function onStepTile(t) {
  if (S.map === "village" && t === "E") goTo("field", 5, 24);
  else if (S.map === "field" && t === "V") goTo("village", 6, 8);
  else if (S.map === "field" && t === "D") goTo("cave1", 9, 7);
  else if (S.map === "field" && t === "G") goTo("castle1", 6, 5);
  else if (S.map === "field" && S.x === 27 && S.y === 13) goTo("cave2", 10, 7);
  else if (S.map === "cave1" && t === "E") goTo("field", 19, 14);
  else if (S.map === "cave1" && t === "S") goTo("cave2", 6, 2);
  else if (S.map === "cave1" && t === "P") goTo("castle2", 10, 4);
  else if (S.map === "cave2" && t === "S") goTo("cave1", 9, 3);
  else if (S.map === "cave2" && t === "E") goTo("field", 27, 13);
  else if (S.map === "castle1" && t === "E") goTo("field", 33, 7);
  else if (S.map === "castle1" && t === "S") goTo("castle2", 2, 4);
  else if (S.map === "castle2" && t === "S") goTo("castle1", 9, 3);
  else if (S.map === "castle2" && t === "E") {
    // Coming from the castle side also opens the hidden wall.
    if (!S.secretOpen) { S.secretOpen = true; setTile("cave1", 1, 6, "P"); logEvent("secret_open"); }
    goTo("cave1", 2, 6);
  }
}

/* ============ Movement & interaction ============ */
const DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
function tryMove(dir) {
  if (mode !== "map" || dialogActive()) return;
  S.dir = dir;
  const d = DIRS[dir], nx = S.x + d[0], ny = S.y + d[1];
  if (isSolid(S.map, nx, ny)) { draw(); return; }
  if (MAPS[S.map].npcs.some(n => n.x === nx && n.y === ny)) { draw(); return; }
  S.x = nx; S.y = ny;
  S.stats.steps++;
  updateSheetEntered();
  // Sheet visibility follows the new position automatically (v0.5).
  const foe = enemyAt(nx, ny);
  if (foe) { startBattle(foe); draw(); return; }
  onStepTile(tileAt(S.map, nx, ny));
  saveQuiet(); draw();
}
function facingPos() { const d = DIRS[S.dir]; return {x:S.x + d[0], y:S.y + d[1]}; }

/* ============ Battle ============ */
/*TEST:king:start*/
function defendReduce(raw) { return Math.floor(raw * 0.25); }
/* King action cycle: phase1 normal(6) -> phase2 wind-up(0) -> phase3 strong(16) -> phase1.
   While asleep the cycle does not advance; when sleep ends after a wind-up
   was cancelled (reset flag), the cycle restarts at phase 1. */
function kingAct(st) {
  if (st.sleep > 0) {
    st.sleep--;
    if (st.sleep === 0 && st.reset) { st.phase = 1; st.reset = false; }
    return { kind:"sleep", dmg:0 };
  }
  if (st.phase === 1) { st.phase = 2; return { kind:"attack", dmg:6 }; }
  if (st.phase === 2) { st.phase = 3; return { kind:"windup", dmg:0 }; }
  st.phase = 1; return { kind:"strong", dmg:16 };
}
/*TEST:king:end*/

let inBattle = false, foe = null, foeHp = 0, battleBusy = false;
let foeState = { sleep:0, phase:1, reset:false }; // sleep = remaining skipped enemy opportunities
let foeFlat = false;        // puni flattened: hero's next attack +3
let defending = false;      // hero is defending this turn
let powderUsed = false;     // sleep powder: once per battle
let foeSkip = false;        // toge soaked by water: skips this turn
let batPreempt = false, batFirstTurn = false;
let battleItemsOpen = false, battleItemCursor = 0;
let battleTurns = 0;
function logBattleEnd(result, enemyType, hp) {
  logEvent("battle_end", { enemy:enemyType, result:result, turns:battleTurns, heroHp:hp });
}

function setBattleMsg(t) { battleMsg = t; if (mode === "battle") draw(); }
function startBattle(enemy) {
  inBattle = true; foe = enemy; battleBusy = false; battleCursor = 0;
  battleTurns = 0;
  foeHp = MONSTERS[enemy.type].hp;
  foeState = { sleep:0, phase:1, reset:false };
  foeFlat = false; defending = false; powderUsed = false; foeSkip = false;
  batPreempt = (enemy.type === "bat");
  batFirstTurn = (enemy.type === "bat");
  battleItemsOpen = false; battleItemCursor = 0;
  mode = "battle";
  logEvent("battle_start", { enemy:enemy.type });
  const m = MONSTERS[enemy.type];
  setBattleMsg(m.name + " が あらわれた！" + (enemy.type === "bat" ? "\nバットンは すばやい！" : ""));
  draw();
}
function endTurn() { defending = false; battleBusy = false; draw(); }
function foeHit(raw, label) {
  const m = MONSTERS[foe.type];
  const dmg = defending ? defendReduce(raw) : raw;
  playSound("hit");
  S.hp -= dmg;
  if (foe.type === "puni" && defending) {
    foeFlat = true;
    setBattleMsg("ぷにぷにの攻撃！\n盾にぶつかって ぺしゃんこになった！");
  } else {
    setBattleMsg((label || (m.name + " の攻撃！")) + "\n" + dmg + " のダメージ！");
  }
  if (S.hp <= 0) { setTimeout(defeat, 900); return; }
  endTurn();
}
function enemyPhase(alreadyActed) {
  if (!inBattle) return;
  if (alreadyActed) { endTurn(); return; }
  const m = MONSTERS[foe.type];
  if (foe.type === "king") {
    const act = kingAct(foeState);
    if (act.kind === "sleep") { setBattleMsg(m.name + "は 眠っている。"); endTurn(); return; }
    if (act.kind === "windup") { setBattleMsg("魔王は こん棒を 大きく振り上げた！"); endTurn(); return; }
    foeHit(act.dmg, act.kind === "strong" ? "魔王の強攻撃！" : "魔王の攻撃！");
    return;
  }
  if (foeState.sleep > 0) {
    foeState.sleep--;
    batFirstTurn = false;
    setBattleMsg(m.name + "は 眠っている。");
    endTurn(); return;
  }
  if (foeSkip) {
    foeSkip = false;
    setBattleMsg(m.name + "は ぬれて動けない！");
    endTurn(); return;
  }
  let label = m.name + " の攻撃！";
  if (foe.type === "bat" && batFirstTurn) label = "バットンの先制攻撃！";
  batFirstTurn = false;
  foeHit(m.atk, label);
}
function heroPhase(action, enemyAlreadyActed) {
  if (!inBattle) return;
  const m = MONSTERS[foe.type];
  if (action.kind !== "fight") foeFlat = false; // a non-attack pick clears the flatten bonus
  if (action.kind === "fight") {
    let dmg = heroAtk() + (foeFlat ? 3 : 0);
    foeFlat = false;
    let crit = false;
    if (Math.random() < 0.05) { dmg *= 2; crit = true; }
    foeHp -= dmg;
    playSound("hit");
    setBattleMsg((crit ? "かいしんの一撃！" : "勇者の攻撃！") + "\n" + dmg + " のダメージ！");
    if (foeHp <= 0) { playSound("defeat"); setTimeout(winBattle, 800); return; }
  } else if (action.kind === "defend") {
    defending = true;
    setBattleMsg("勇者は身を守った。");
  } else if (action.kind === "herb") {
    S.herbs--;
    const healed = Math.min(16, heroMaxHp() - S.hp);
    S.hp += healed;
    setBattleMsg("やくそうを使った。\nHPが " + healed + " 回復した！");
  } else if (action.kind === "water") {
    S.water--;
    if (foe.type === "toge") {
      foeHp -= 8; foeSkip = true;
      playSound("hit");
      setBattleMsg("水びんを投げつけた！\nトゲタケに 8 のダメージ！ 傘がしぼんだ！");
      if (foeHp <= 0) { playSound("defeat"); setTimeout(winBattle, 800); return; }
    } else {
      setBattleMsg("水びんを投げつけた！\nしかし、効果がなかった。");
    }
  } else if (action.kind === "powder") {
    powderUsed = true;
    if (foe.type === "bat" || foe.type === "king") {
      foeState.sleep = 2;
      if (foe.type === "king") foeState.reset = true;
      setBattleMsg("ねむり粉を振りかけた！\n" + m.name + "は 眠ってしまった！");
    } else {
      setBattleMsg("ねむり粉を振りかけた！\nしかし、効果がなかった。");
    }
  }
  setTimeout(() => enemyPhase(enemyAlreadyActed), 800);
}
function heroAction(action) {
  if (!inBattle || battleBusy) return;
  battleBusy = true;
  battleTurns++;
  S.stats.battleTurns++;
  /* Bat preemptive strike: defend and sleep powder resolve BEFORE it;
     every other first action lets the bat strike first (that strike is
     the bat's action for the turn). */
  if (batPreempt && action.kind !== "defend" && action.kind !== "powder") {
    batPreempt = false; batFirstTurn = false;
    playSound("hit");
    S.hp -= MONSTERS.bat.atk;
    setBattleMsg("バットンの先制攻撃！\n" + MONSTERS.bat.atk + " のダメージ！");
    if (S.hp <= 0) { setTimeout(defeat, 900); return; }
    setTimeout(() => heroPhase(action, true), 800);
    return;
  }
  batPreempt = false;
  heroPhase(action, false);
}
function escapeBattle() {
  if (foe) logBattleEnd("flee", foe.type, S.hp);
  foe.inactive = true;
  inBattle = false; foe = null; battleBusy = false; battleItemsOpen = false;
  mode = "map";
  saveQuiet(); draw();
  showDialog(["勇者は逃げ出した。"]);
}
function doRun() {
  if (!inBattle || battleBusy) return;
  if (foe.type === "king") { setBattleMsg("魔王からは逃げられない！"); return; }
  battleTurns++;
  S.stats.battleTurns++;
  if (batPreempt) {
    batPreempt = false; batFirstTurn = false; battleBusy = true;
    playSound("hit");
    S.hp -= MONSTERS.bat.atk;
    setBattleMsg("バットンの先制攻撃！\n" + MONSTERS.bat.atk + " のダメージ！");
    if (S.hp <= 0) { setTimeout(defeat, 900); return; }
    setTimeout(escapeBattle, 800);
    return;
  }
  escapeBattle();
}
function battleItems() {
  const list = [
    { kind:"herb",  label:"やくそう ×" + S.herbs, usable: S.herbs > 0 },
    { kind:"water", label:"水びん ×" + S.water,   usable: S.water > 0 }
  ];
  if (S.hasSleepPowder) {
    list.push({ kind:"powder", label:"ねむり粉" + (powderUsed ? "（使用済み）" : ""), usable: !powderUsed });
  }
  list.push({ kind:"back", label:"もどる", usable:true });
  return list;
}
function useBattleItem(i) {
  const it = battleItems()[i];
  if (!it) return;
  if (it.kind === "back") { playSound("cancel"); battleItemsOpen = false; draw(); return; }
  if (!it.usable) {
    playSound("cancel");
    battleItemsOpen = false;
    setBattleMsg("それは今 使えない。");
    draw(); return;
  }
  playSound("confirm");
  battleItemsOpen = false;
  heroAction({ kind: it.kind });
}
function battleCommand(id) {
  if (!inBattle || battleBusy) return;
  playSound("confirm");
  if (id === "fight") heroAction({ kind:"fight" });
  else if (id === "defend") heroAction({ kind:"defend" });
  else if (id === "items") { battleItemsOpen = true; battleItemCursor = 0; draw(); }
  else if (id === "run") doRun();
}
function winBattle() {
  const enemyType = foe.type;
  const endHp = S.hp;
  const levelBefore = S.lv;
  const m = MONSTERS[foe.type];
  S.stats.wins++;
  S.exp += m.exp; S.gold += m.gold;
  const lines = [m.name + " を倒した！", m.exp + " EXP、" + m.gold + " G を手に入れた。"];
  while (S.lv < 3 && EXP_NEXT[S.lv] && S.exp >= EXP_NEXT[S.lv]) {
    S.lv++; S.hp += 6;
    logEvent("levelup", { lv:S.lv });
    lines.push("レベルが " + S.lv + " に上がった！ 最大HP+6、攻撃力 " + heroAtk() + "。");
  }
  playSound("victory");
  if (S.lv > levelBefore) playSound("levelup");
  foe.inactive = true;
  const wasBoss = enemyType === "king";
  logBattleEnd("win", enemyType, endHp);
  if (wasBoss) logEvent("boss_win");
  inBattle = false; foe = null; battleBusy = false; battleItemsOpen = false;
  mode = "map";
  if (wasBoss) {
    S.cleared = true;
    S.clearRecord = { timeMs: currentElapsed(), lv: S.lv, wins: S.stats.wins, steps: S.stats.steps, deaths: S.stats.deaths };
    saveQuiet(); draw();
    showDialog(lines.concat([
      "魔王を倒した！",
      "クリア時間　" + fmtTime(S.clearRecord.timeMs),
      "クリアレベル　" + S.clearRecord.lv,
      "戦闘勝利回数　" + S.clearRecord.wins,
      "歩数　" + S.clearRecord.steps,
      "全滅回数　" + S.clearRecord.deaths
    ]));
  } else {
    saveQuiet(); draw();
    showDialog(lines);
  }
}
function defeat() {
  if (foe) logBattleEnd("wipe", foe.type, S.hp);
  logEvent("wipe");
  inBattle = false; foe = null; battleBusy = false; battleItemsOpen = false;
  mode = "map";
  S.stats.deaths++;
  S.hp = heroMaxHp();
  S.map = "village"; S.x = 2; S.y = 3; S.dir = "down";
  spawnEnemies(); saveQuiet(); draw();
  showDialog(["勇者は死んでしまった……", "教会で目を覚ました。HPは全回復している。", "（EXP・ゴールド・アイテムは失われていない）"]);
}

/* ============ Input: keyboard ============ */
document.addEventListener("keydown", e => {
  initAudio();
  lastPointer = false;
  const k = e.key;
  const isConfirm = (k === " " || k === "z" || k === "Z" || k === "Enter");
  if (mode === "menu") {
    if (k === "ArrowUp" || k === "w" || k === "W") { menuMove(-1); e.preventDefault(); }
    else if (k === "ArrowDown" || k === "s" || k === "S") { menuMove(1); e.preventDefault(); }
    else if (k === "Enter" || k === "z" || k === "Z") { menuConfirm(); e.preventDefault(); }
    else if (k === "Backspace" || k === "x" || k === "X" || k === "Escape") { menuBack(); e.preventDefault(); }
    return;
  }
  if (mode === "battle") {
    if (battleItemsOpen) {
      const n = battleItems().length;
      if (k === "ArrowUp" || k === "w" || k === "W") { const before = battleItemCursor; battleItemCursor = (battleItemCursor + n - 1) % n; if (battleItemCursor !== before) playSound("cursor"); draw(); e.preventDefault(); }
      else if (k === "ArrowDown" || k === "s" || k === "S") { const before = battleItemCursor; battleItemCursor = (battleItemCursor + 1) % n; if (battleItemCursor !== before) playSound("cursor"); draw(); e.preventDefault(); }
      else if (isConfirm) { useBattleItem(battleItemCursor); e.preventDefault(); }
      else if (k === "Backspace" || k === "x" || k === "X" || k === "Escape") { playSound("cancel"); battleItemsOpen = false; draw(); e.preventDefault(); }
      return;
    }
    if (k === "ArrowLeft" || k === "a" || k === "A") { battleCursor = (battleCursor + BCMDS.length - 1) % BCMDS.length; playSound("cursor"); draw(); e.preventDefault(); }
    else if (k === "ArrowRight" || k === "d" || k === "D") { battleCursor = (battleCursor + 1) % BCMDS.length; playSound("cursor"); draw(); e.preventDefault(); }
    else if (isConfirm) { battleCommand(BCMDS[battleCursor].id); e.preventDefault(); }
    return;
  }
  // map mode
  if (k === "x" || k === "X" || k === "Escape") {
    if (!dialogActive()) { openMenu(); e.preventDefault(); }
    return;
  }
  if (dialogActive()) {
    if (dialogChoices) {
      if (k === "ArrowLeft" || k === "a" || k === "A" || k === "ArrowRight" || k === "d" || k === "D") {
        const before = dialogChoices.sel;
        dialogChoices.sel = (dialogChoices.sel + 1) % dialogChoices.options.length;
        if (dialogChoices.sel !== before) playSound("cursor");
        draw(); e.preventDefault();
      } else if (isConfirm) { chooseDialogOption(dialogChoices.sel); e.preventDefault(); }
      return;
    }
    if (isConfirm) { advanceDialog(); e.preventDefault(); }
    return;
  }
  if (k === "ArrowUp" || k === "w" || k === "W") { tryMove("up"); e.preventDefault(); }
  else if (k === "ArrowDown" || k === "s" || k === "S") { tryMove("down"); e.preventDefault(); }
  else if (k === "ArrowLeft" || k === "a" || k === "A") { tryMove("left"); e.preventDefault(); }
  else if (k === "ArrowRight" || k === "d" || k === "D") { tryMove("right"); e.preventDefault(); }
  else if (isConfirm) { interact(); e.preventDefault(); }
});

/* ============ Input: pointer (mouse / touch) — shown only after actual pointer use ============ */
cv.addEventListener("pointerdown", e => {
  initAudio();
  lastPointer = true;
  const p = toLogical(e);
  if (mode === "menu") { menuClick(p); return; }
  if (mode === "battle") {
    if (battleItemsOpen) {
      const list = battleItems();
      for (let i = 0; i < list.length; i++) {
        if (inRect(p, 8, 160 + i * 16, 384, 16)) {
          if (battleItemCursor === i) useBattleItem(i);
          else { battleItemCursor = i; playSound("cursor"); draw(); }
          return;
        }
      }
      return;
    }
    for (let i = 0; i < BCMDS.length; i++) {
      const r = cmdRect(i);
      if (inRect(p, r.x, r.y, r.w, r.h)) {
        if (battleCursor === i) battleCommand(BCMDS[i].id);
        else { battleCursor = i; playSound("cursor"); draw(); }
        return;
      }
    }
    return;
  }
  // map mode
  if (dialogActive()) {
    if (dialogChoices) {
      const n = dialogChoices.options.length;
      if (inRect(p, 8, 184, 384, 48)) {
        const idx = Math.min(n - 1, Math.floor((p.x - 8) / 384 * n));
        if (dialogChoices.sel === idx) chooseDialogOption(idx);
        else { dialogChoices.sel = idx; playSound("cursor"); draw(); }
      }
      return;
    }
    advanceDialog();
    return;
  }
  if (inRect(p, MENU_BTN.x, MENU_BTN.y, MENU_BTN.w, MENU_BTN.h)) { openMenu(); return; }
  for (const key in DPAD) {
    const b = DPAD[key];
    if (inRect(p, b.x, b.y, b.w, b.h)) { tryMove(key); return; }
  }
  const ddx = p.x - ABTN.x, ddy = p.y - ABTN.y;
  if (ddx * ddx + ddy * ddy <= ABTN.r * ABTN.r) { interact(); return; }
});

/* ============ Boot ============ */
(async () => {
  const loaded = await loadGame();
  await loadPlayLog();
  const KNOWN_MAPS = ["village", "field", "cave", "castle", "cave1", "cave2", "castle1", "castle2"];
  if (loaded && loaded.map && KNOWN_MAPS.indexOf(loaded.map) >= 0) {
    S = migrateSave(loaded);
    if (S.secretOpen) setTile("cave1", 1, 6, "P");
  }
  playStart = Date.now();
  spawnEnemies();
  lastSheetId = currentSheet() ? currentSheet().id : null;
  logEvent(loaded ? "load" : "start");
  draw();
  showDialog([S.cleared ? "（セーブデータを読み込んだ。クリア済みの世界だ）" : "（セーブデータを読み込んだ／新しい冒険）"]);
})();
</script>
